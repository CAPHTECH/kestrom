[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrom"
version = "0.1.0"
description = "Edit a language model inside a range anyone can check with kestrom-verify"
readme = "README.md"
license = "LicenseRef-PolyForm-Small-Business-1.0.0 OR LicenseRef-PolyForm-Noncommercial-1.0.0 OR LicenseRef-PolyForm-Free-Trial-1.0.0"
license-files = ["LICENSE", "LICENSE-POLYFORM-SMALL-BUSINESS.md", "LICENSE-POLYFORM-NONCOMMERCIAL.md", "LICENSE-POLYFORM-FREE-TRIAL.md", "COMMERCIAL.md"]
requires-python = ">=3.10"
dependencies = ["kestrom-verify", "numpy"]
authors = [{ name = "CAPH TECH Inc." }]
keywords = ["llm", "ai-security", "information-flow-control", "model-editing", "backdoor-detection"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/CAPHTECH/kestrom"
Repository = "https://github.com/CAPHTECH/kestrom"
Issues = "https://github.com/CAPHTECH/kestrom/issues"

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm", "transformers"]
gguf = ["gguf", "transformers"]
torch = ["torch", "transformers>=5", "safetensors"]
cuda = ["torch", "transformers>=5", "safetensors", "bitsandbytes", "accelerate"]

[project.scripts]
kestrom = "kestrom.__main__:main"

[tool.setuptools]
packages = ["kestrom"]

[tool.setuptools.package-data]
kestrom = ["data/*.json"]
