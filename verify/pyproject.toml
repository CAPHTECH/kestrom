[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrom-verify"
version = "0.1.0"
description = "Check a language-model weight edit: what changed, byte for byte, and that outputs outside the declared range stayed bit-identical"
readme = "README.md"
license-files = ["LICENSE"]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy"]
authors = [{ name = "CAPH TECH Inc." }]
keywords = ["llm", "verification", "ai-security", "model-audit", "safetensors", "gguf"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/CAPHTECH/kestrom"
Repository = "https://github.com/CAPHTECH/kestrom"
Issues = "https://github.com/CAPHTECH/kestrom/issues"

[project.optional-dependencies]
mlx = ["mlx", "mlx-lm", "transformers"]
gguf = ["gguf", "transformers"]
torch = ["torch", "transformers>=5", "safetensors"]

[project.scripts]
kestrom-verify = "kestrom_verify.__main__:main"

[tool.setuptools]
packages = ["kestrom_verify"]
